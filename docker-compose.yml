# Docker path: `docker compose up`. Non-Docker users: `composer setup && composer dev`.
x-env: &env
  DB_DATABASE: /var/www/html/database/sqlite/database.sqlite
  REDIS_HOST: redis
  # php containers publish to Reverb over the compose network; the browser uses localhost (VITE_REVERB_HOST).
  REVERB_HOST: reverb

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: yoprint-app
  working_dir: /var/www/html
  entrypoint: ["sh", "/var/www/html/docker/entrypoint.sh"]
  volumes:
    - .:/var/www/html
    - sqlite-data:/var/www/html/database/sqlite
    - vendor:/var/www/html/vendor
    - node-modules:/var/www/html/node_modules
  environment: *env
  depends_on:
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    command: php artisan serve --host=0.0.0.0 --port=8000
    environment:
      <<: *env
      BOOTSTRAP: "1"
    ports:
      - "8000:8000"

  horizon:
    <<: *app
    command: php artisan horizon

  reverb:
    <<: *app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"

  vite:
    <<: *app
    command: sh -c "[ -d node_modules/.bin ] || npm install --no-audit --no-fund; npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

volumes:
  sqlite-data:
  vendor:
  node-modules:
  redis-data:
